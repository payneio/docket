[project]
name = "docket"
version = "0.1.0"
description = "Docket — a register of what is owed, by whom, to whom, and how it is going"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
docket = "docket.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docket"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One loop for the whole session. The engine's connection pool is created on the
# loop that first touches it; a loop per test hands the next test a pool full of
# connections belonging to a loop that has closed.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
