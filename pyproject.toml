[project]
name = "docket"
version = "0.1.0"
description = "Docket — a register of what is owed, by whom, to whom, and how it is going"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
    # The board. Server-rendered HTML forms, so: templates, and a form parser.
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    # The register, as tools. See src/docket/mcp.py.
    "fastmcp>=2.11",
    # Which run a move was part of: the W3C propagator only. No SDK, no
    # exporter -- see src/docket/tracing.py.
    "opentelemetry-api>=1.30",
]

[project.scripts]
docket = "docket.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docket"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.15.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One loop for the whole session. The engine's connection pool is created on the
# loop that first touches it; a loop per test hands the next test a pool full of
# connections belonging to a loop that has closed.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
# The prose in this codebase is load-bearing and wraps at 88; the code that
# carries it runs a little wider. 100 is what the existing files already use.
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ANN", "RUF"]
ignore = [
    # `Depends(...)` in a default *is* the FastAPI idiom. The rule is right about
    # mutable defaults in general and wrong about every route in this codebase.
    "B008",
    # Pydantic and SQLAlchemy declarative bodies are full of bare assignments
    # that mypy already types from the right-hand side.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Tests say what they mean in their names and asserts; annotating every fixture
# return would be noise, and `assert` is the point.
"tests/*" = ["ANN", "S101"]
"migrations/*" = ["ANN", "E501", "I001"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Not `strict`: the value here is catching a wrong type crossing a boundary, and
# demanding annotations on every private helper buys noise rather than safety.
check_untyped_defs = true

[[tool.mypy.overrides]]
# Neither ships type information, and both are only touched by the test rig and
# the migration runner.
module = ["alembic.*", "psycopg.*"]
ignore_missing_imports = true
