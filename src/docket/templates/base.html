<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}docket{% endblock %}</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  /* Inline rather than mounted: one stylesheet for one page, and a served file
     would be one more thing that can be missing when the register is the thing
     you came here to read. */
  :root {
    --ink: #1b1b1a; --dim: #6a6a66; --faint: #a6a6a0;
    --rule: #e2e1dc; --page: #faf9f6; --card: #fff;
    --wait: #8a5a00; --ours: #1b1b1a;
  }
  * { box-sizing: border-box; }
  body {
    font: 15px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--ink); background: var(--page);
    margin: 0; padding: 2.5rem 1.5rem 6rem; }
  main { max-width: 46rem; margin: 0 auto; }
  a { color: inherit; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .02em;
       margin: 0 0 2.5rem; color: var(--dim); }
  h1 b { color: var(--ink); font-weight: 600; }
  h1 a { text-decoration: none; }
  h1 a:hover b { text-decoration: underline; }
  header { display: flex; justify-content: space-between; align-items: flex-start;
           gap: 1rem; margin: 0 0 2.5rem; }
  header h1 { margin: 0; }
  .menu { position: relative; font-size: 13px; }
  .menu summary { list-style: none; cursor: pointer; color: var(--dim);
                  -webkit-tap-highlight-color: transparent;
                  padding: 0 .3rem; border: 1px solid transparent; border-radius: 3px;
                  line-height: 1.4; user-select: none; }
  .menu summary::-webkit-details-marker { display: none; }
  .menu summary:hover, .menu[open] summary { border-color: var(--rule); color: var(--ink); }
  .menu nav { position: absolute; right: 0; top: calc(100% + .3rem); z-index: 1;
              min-width: 14rem; background: var(--card); border: 1px solid var(--rule);
              border-radius: 3px; padding: .3rem 0; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .menu nav a { display: block; padding: .3rem .9rem; text-decoration: none; }
  .menu nav a:hover { background: var(--page); }
  .menu nav a.here { font-weight: 600; }
  @media (max-width: 40rem) {
    .menu summary { font-size: 20px; padding: .2rem .6rem; margin: -.4rem -.3rem 0 0; }
    .menu nav a { padding: .6rem 1rem; }
  }
  .menu .whoami { padding: .3rem .9rem .5rem; font-size: 12px; color: var(--faint);
                  border-bottom: 1px solid var(--rule); margin-bottom: .3rem; }
  .menu .whoami b { color: var(--ink); font-weight: 600; }
  .menu form { padding: .4rem .9rem .2rem; border-top: 1px solid var(--rule); margin-top: .3rem; }
  h2 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
       color: var(--dim); font-weight: 600;
       margin: 2.5rem 0 .75rem; padding-bottom: .4rem; border-bottom: 1px solid var(--rule); }
  h2 span { float: right; color: var(--faint); letter-spacing: 0; }
  .entry { background: var(--card); border: 1px solid var(--rule);
           border-radius: 3px; padding: .8rem .9rem; margin-bottom: .5rem; }
  .entry.mine { border-left: 3px solid var(--wait); }
  .line1 { display: flex; gap: .8rem; align-items: baseline;
           color: var(--dim); font-size: 13px; }
  .state { font-weight: 600; color: var(--ink); min-width: 5.5rem; }
  .age { min-width: 3.5rem; }
  .who { color: var(--dim); }
  .label { margin: .35rem 0 .1rem; }
  .label a { text-decoration: none; }
  .label a:hover { text-decoration: underline; }
  .snap { color: var(--faint); font-size: 12px; }
  .terms { color: var(--dim); font-size: 13px; margin: .15rem 0; }
  .warn { color: var(--wait); font-size: 13px; margin: .2rem 0 0; }
  .moves { margin-top: .55rem; display: flex; flex-wrap: wrap; gap: .3rem; }
  .moves form { display: inline; }
  button { font: inherit; font-size: 12px; cursor: pointer;
           background: var(--page); color: var(--ink);
           border: 1px solid var(--rule); border-radius: 3px; padding: .2rem .6rem; }
  button:hover { border-color: var(--dim); }
  button.theirs { color: var(--dim); font-style: italic; }
  .empty { color: var(--faint); padding: .4rem 0; }
  .note { color: var(--faint); font-size: 12px; margin-top: 3rem;
          border-top: 1px solid var(--rule); padding-top: .8rem; }
  .error { background: #fff4f0; border: 1px solid #e8c4b8; color: #8a2d00;
           padding: .6rem .8rem; border-radius: 3px; margin-bottom: 1.2rem; font-size: 13px; }
  table.log { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: .5rem; }
  table.log td { padding: .3rem .6rem .3rem 0; border-bottom: 1px solid var(--rule);
                 vertical-align: top; color: var(--dim); }
  table.log td.move { color: var(--ink); font-weight: 600; }
  table.log td.note { color: var(--ink); font-weight: 400; }
  table.log tr.head td { color: var(--faint); font-size: 12px; letter-spacing: .06em;
                         text-transform: uppercase; }
  table.log tr.gone td { color: var(--faint); text-decoration: line-through; }
  table.log tr.gone td.acts { text-decoration: none; }
  td.acts { text-align: right; white-space: nowrap; }
  td.acts form { display: inline; margin-left: .25rem; }
  .minted { background: #fffaf0; border: 1px solid #e6d3a8; border-radius: 3px;
            padding: .8rem .9rem; margin-bottom: 1.5rem; }
  .mintedhead { margin: 0 0 .5rem; font-weight: 600; color: var(--wait); font-size: 13px; }
  .secret { display: block; background: var(--ink); color: var(--page);
            padding: .5rem .6rem; border-radius: 3px; word-break: break-all;
            font-size: 13px; user-select: all; }
  .mintedfoot { margin: .55rem 0 0; font-size: 12px; color: var(--dim); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
  .two form { background: var(--card); border: 1px solid var(--rule);
              border-radius: 3px; padding: .9rem; }
  .two input { margin-bottom: .4rem; }
  @media (max-width: 40rem) { .two { grid-template-columns: 1fr; } }
  input[type=password], input[type=text], input[type=number], textarea {
    font: inherit; font-size: 13px; padding: .35rem .5rem; width: 100%;
    border: 1px solid var(--rule); border-radius: 3px; background: var(--card); }
  textarea { margin-bottom: .4rem; }
</style>
<main>
  <header>
    <h1><a href="/"><b>docket</b></a> &nbsp;›&nbsp; {% block heading %}{{ heading }}{% endblock %}</h1>
    {% if signed_in_as %}{% set here = request.url.path %}
    <details class="menu">
      <summary aria-label="menu">&#9776;</summary>
      <nav>
        <div class="whoami">signed in as <b>{{ signed_in_as }}</b></div>
        <a href="/board"{% if here == '/board' %} class="here"{% endif %}>board</a>
        <a href="/board/activity"{% if here == '/board/activity' %} class="here"{% endif %}>activity</a>
        {% if is_owner %}<a href="/board/access"{% if here == '/board/access' %} class="here"{% endif %}>access</a>{% endif %}
        <form method="post" action="/board/sign-out"><button type="submit">sign out</button></form>
      </nav>
    </details>
    <script>
      // <details> only closes from its own summary; a menu should also close
      // when you tap or click anywhere else, or press Escape.
      const menu = document.querySelector(".menu");
      document.addEventListener("click", e => { if (!menu.contains(e.target)) menu.open = false; });
      document.addEventListener("keydown", e => { if (e.key === "Escape") menu.open = false; });
    </script>{% endif %}
  </header>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% block body %}{% endblock %}
</main>
